openapi: 3.0.3
info:
  title: Servex API
  description: |
    API specification for the Servex HTTP server library. Servex is a production-ready
    HTTP(S) server library built on net/http and gorilla/mux, featuring JWT-based
    authentication, email verification, OAuth social login, two-factor authentication,
    rate limiting, reverse proxy, and more.

    Authentication endpoints are registered under a configurable base path (default
    `/api/v1/auth`). System endpoints (health, metrics) are registered at the root level.

    Access tokens are returned in JSON response bodies and must be sent as
    `Authorization: Bearer <token>`. Refresh tokens are set as HttpOnly cookies and
    are automatically sent by the browser on refresh/logout requests.
  version: 2.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: "{scheme}://{host}{authBasePath}"
    description: Auth endpoints
    variables:
      scheme:
        default: https
        enum: [http, https]
      host:
        default: localhost:8080
      authBasePath:
        default: /api/v1/auth
        description: Base path for authentication endpoints
  - url: "{scheme}://{host}"
    description: System endpoints (health, metrics)
    variables:
      scheme:
        default: https
        enum: [http, https]
      host:
        default: localhost:8080

tags:
  - name: Auth
    description: Core authentication (register, login, refresh, logout, user info)
  - name: Email Verification
    description: Email verification and resend flows
  - name: Password Reset
    description: Forgot password and reset password flows
  - name: OAuth
    description: OAuth social login, account linking and unlinking
  - name: Two-Factor Authentication
    description: TOTP-based two-factor authentication setup, verification, and email fallback
  - name: System
    description: Health check and metrics endpoints

security: []

paths:
  # ---------- Core Auth ----------

  /register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: |
        Creates a new user account. On success, returns user info with an access token
        in the response body and sets a refresh token as an HttpOnly cookie.

        If email verification is enabled with `RequireVerification`, a 200 response is
        returned with a message instructing the user to verify their email before logging in.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: john
              password: securepass123
              email: john@example.com
      responses:
        "201":
          description: User created successfully
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie
              schema:
                type: string
                example: _servexrt=eyJ...; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "200":
          description: User created but email verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: check your email to verify your account
        "400":
          description: Validation error (missing fields, password too short)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: password must be at least 8 characters
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: username already exists

  /login:
    post:
      tags: [Auth]
      summary: Login with credentials
      description: |
        Authenticates a user with username and password. On success, returns user info
        with an access token and sets a refresh token cookie.

        If the user has two-factor authentication enabled, a `twoFactorToken` is returned
        instead. The client must then call `POST /2fa/verify` with this token and a valid
        TOTP code to complete the login.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: john
              password: securepass123
      responses:
        "200":
          description: |
            Login successful. Either returns full auth response (normal login) or a
            two-factor token (2FA enabled).
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie (not set when 2FA is pending)
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthResponse"
                  - $ref: "#/components/schemas/TwoFactorPendingResponse"
              examples:
                normalLogin:
                  summary: Standard login response
                  value:
                    id: user-1
                    username: john
                    roles: [user]
                    accessToken: eyJhbGciOiJIUzI1NiJ9...
                twoFactorPending:
                  summary: 2FA verification required
                  value:
                    twoFactorToken: pending-token-value
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: invalid email or password
        "403":
          description: Email not verified (when RequireVerification is enabled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: email not verified

  /refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: |
        Exchanges the refresh token (sent automatically via HttpOnly cookie) for a new
        access token and a new refresh token. The old refresh token is invalidated and
        a new one is stored in the database and set as a cookie.
      operationId: refreshTokens
      parameters:
        - in: cookie
          name: _servexrt
          required: true
          schema:
            type: string
          description: Refresh token cookie (sent automatically by the browser)
      responses:
        "200":
          description: Tokens refreshed successfully
          headers:
            Set-Cookie:
              description: New HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid, expired, or missing refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: invalid refresh token

  /logout:
    post:
      tags: [Auth]
      summary: Logout and invalidate refresh token
      description: |
        Invalidates the refresh token by clearing its hash in the database and deleting
        the cookie. The access token remains valid until its natural expiry.
      operationId: logout
      parameters:
        - in: cookie
          name: _servexrt
          required: true
          schema:
            type: string
          description: Refresh token cookie (sent automatically by the browser)
      responses:
        "204":
          description: Logged out successfully (cookie cleared)

  /me:
    get:
      tags: [Auth]
      summary: Get current user info
      description: Returns the authenticated user's ID, username, and roles.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
              example:
                id: user-1
                username: john
                roles: [user]
        "401":
          description: Not authenticated or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ---------- Email Verification ----------

  /verify-email:
    post:
      tags: [Email Verification]
      summary: Verify email address
      description: |
        Verifies a user's email address. The request body format depends on the configured
        verification mode:

        - **Code mode** (default): Send `code` and `email` fields. The code is a short
          numeric string (e.g. 6 digits) sent to the user's email.
        - **Token mode**: Send a `token` field. The token is a long string in
          `userID:randomHex` format, typically embedded in a verification URL.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
            examples:
              codeMode:
                summary: Code mode verification
                value:
                  code: "123456"
                  email: john@example.com
              tokenMode:
                summary: Token mode verification
                value:
                  token: "user-1:a1b2c3d4e5f6"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: email verified successfully
        "400":
          description: Invalid or expired token/code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: invalid or expired verification code

  /resend-verification:
    post:
      tags: [Email Verification]
      summary: Resend verification email
      description: |
        Resends the verification email to the authenticated user. Subject to a cooldown
        period (default 60 seconds) to prevent abuse.
      operationId: resendVerification
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: verification email sent
        "400":
          description: Email already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: email already verified
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Resend cooldown not elapsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: please wait before requesting another verification email

  # ---------- Password Reset ----------

  /forgot-password:
    post:
      tags: [Password Reset]
      summary: Request password reset
      description: |
        Initiates a password reset flow by sending a reset token to the user's email.
        Always returns a success response regardless of whether the account exists,
        to prevent user enumeration.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
            example:
              identifier: john@example.com
      responses:
        "200":
          description: Reset email sent (or no-op if account does not exist)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: if the account exists, a reset link has been sent

  /reset-password:
    post:
      tags: [Password Reset]
      summary: Reset password with token
      description: |
        Resets the user's password using a token received via email. The token is a
        one-time use token that expires after a configurable duration (default 1 hour).
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            example:
              token: "user-1:a1b2c3d4e5f6"
              password: newSecurePass456
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: password reset successfully
        "400":
          description: Invalid or expired token, or password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: invalid or expired reset token

  # ---------- OAuth ----------

  /oauth/{provider}:
    get:
      tags: [OAuth]
      summary: Redirect to OAuth provider
      description: |
        Initiates the OAuth flow by redirecting the user to the specified provider's
        authorization page. The state parameter is signed with HMAC to prevent CSRF.
      operationId: oauthRedirect
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "302":
          description: Redirect to OAuth provider authorization URL
          headers:
            Location:
              description: OAuth provider authorization URL
              schema:
                type: string
                format: uri
        "404":
          description: OAuth provider not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: OAuth provider not found

  /oauth/{provider}/callback:
    get:
      tags: [OAuth]
      summary: Handle OAuth provider callback
      description: |
        Handles the callback from an OAuth provider after user authorization. Validates
        the state parameter, exchanges the authorization code for user info, and either
        logs in an existing user or creates a new account.

        If email verification is required and the user's email is not yet verified,
        a message response is returned instead of tokens.
      operationId: oauthCallback
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: code
          in: query
          required: true
          description: Authorization code from the OAuth provider
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: Signed state parameter for CSRF protection
          schema:
            type: string
      responses:
        "200":
          description: OAuth login/registration successful
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthResponse"
                  - $ref: "#/components/schemas/MessageResponse"
              examples:
                loginSuccess:
                  summary: Successful OAuth login
                  value:
                    id: user-1
                    username: john
                    roles: [user]
                    accessToken: eyJhbGciOiJIUzI1NiJ9...
                emailVerificationRequired:
                  summary: Account created, email verification needed
                  value:
                    message: account created, please verify your email
        "400":
          description: State mismatch or invalid callback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: invalid OAuth state
        "401":
          description: OAuth authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /oauth/{provider}/link:
    post:
      tags: [OAuth]
      summary: Link OAuth provider to account
      description: |
        Links an OAuth provider to the authenticated user's account by exchanging an
        authorization code for provider user info.
      operationId: oauthLink
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthLinkRequest"
            example:
              code: authorization-code-from-provider
      responses:
        "200":
          description: OAuth provider linked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: OAuth provider linked successfully
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Provider already linked to this or another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: OAuth provider already linked

    delete:
      tags: [OAuth]
      summary: Unlink OAuth provider from account
      description: Removes the link between an OAuth provider and the authenticated user's account.
      operationId: oauthUnlink
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "200":
          description: OAuth provider unlinked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: OAuth provider unlinked successfully
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Provider not linked to this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: OAuth provider not linked

  # ---------- Two-Factor Authentication ----------

  /2fa/setup:
    post:
      tags: [Two-Factor Authentication]
      summary: Setup two-factor authentication
      description: |
        Generates a TOTP secret and backup codes for the authenticated user. The secret
        is encrypted and stored in the database, but 2FA is not yet enabled. The client
        should display the QR code (from the `url` field) and prompt the user to enter
        a verification code to enable 2FA via `POST /2fa/enable`.
      operationId: twoFactorSetup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 2FA setup data generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorSetupResponse"
              example:
                secret: JBSWY3DPEHPK3PXP
                url: "otpauth://totp/MyApp:john?secret=JBSWY3DPEHPK3PXP&issuer=MyApp"
                backupCodes:
                  - "12345678"
                  - "87654321"
                  - "11223344"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 2FA already enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: two-factor authentication is already enabled

  /2fa/enable:
    post:
      tags: [Two-Factor Authentication]
      summary: Enable two-factor authentication
      description: |
        Enables 2FA for the authenticated user by verifying a TOTP code generated from
        the secret provided during setup. The user must call `POST /2fa/setup` first.
      operationId: twoFactorEnable
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
            example:
              code: "123456"
      responses:
        "200":
          description: 2FA enabled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: 2FA enabled successfully
        "401":
          description: Invalid TOTP code or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: invalid verification code

  /2fa/disable:
    post:
      tags: [Two-Factor Authentication]
      summary: Disable two-factor authentication
      description: Disables 2FA for the authenticated user after verifying a valid TOTP code.
      operationId: twoFactorDisable
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeRequest"
            example:
              code: "123456"
      responses:
        "200":
          description: 2FA disabled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: 2FA disabled successfully
        "400":
          description: 2FA not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: two-factor authentication is not enabled
        "401":
          description: Invalid code or not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /2fa/verify:
    post:
      tags: [Two-Factor Authentication]
      summary: Verify 2FA code to complete login
      description: |
        Completes the login flow for users with 2FA enabled. The client must provide
        the `twoFactorToken` received from the login endpoint along with a valid TOTP
        code or backup code.
      operationId: twoFactorVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorVerifyRequest"
            example:
              token: pending-2fa-token
              code: "123456"
      responses:
        "200":
          description: 2FA verification successful, login complete
          headers:
            Set-Cookie:
              description: HttpOnly refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                id: user-1
                username: john
                roles: [user]
                accessToken: eyJhbGciOiJIUzI1NiJ9...
        "401":
          description: Invalid token or code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: invalid verification code

  /2fa/send-email-code:
    post:
      tags: [Two-Factor Authentication]
      summary: Send 2FA verification code via email
      description: |
        Sends a one-time verification code to the user's email address as a fallback
        when the user cannot use their TOTP app. Requires a valid pending 2FA token
        from the login endpoint. Subject to a cooldown period.
      operationId: twoFactorSendEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorSendEmailCodeRequest"
            example:
              token: pending-2fa-token
      responses:
        "200":
          description: Verification code sent to email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: verification code sent
        "429":
          description: Cooldown period not elapsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: please wait before requesting another code

  # ---------- System ----------

  /health:
    servers:
      - url: "{scheme}://{host}"
        description: Root-level system endpoint
        variables:
          scheme:
            default: https
            enum: [http, https]
          host:
            default: localhost:8080
    get:
      tags: [System]
      summary: Health check
      description: Returns the server health status and current timestamp.
      operationId: healthCheck
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                timestamp: "2024-01-01T00:00:00Z"

  /metrics:
    servers:
      - url: "{scheme}://{host}"
        description: Root-level system endpoint
        variables:
          scheme:
            default: https
            enum: [http, https]
          host:
            default: localhost:8080
    get:
      tags: [System]
      summary: Prometheus metrics
      description: |
        Exposes Prometheus-compatible metrics in text exposition format. Only available
        when metrics are enabled in server configuration.
      operationId: prometheusMetrics
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP http_requests_total Total number of HTTP requests
                  # TYPE http_requests_total counter
                  http_requests_total{method="GET",path="/health",status="200"} 42

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token obtained from login, register, or refresh endpoints.
        Send as `Authorization: Bearer <accessToken>`.

  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      description: OAuth provider name (e.g. google, github, facebook)
      schema:
        type: string
        example: google

  schemas:
    # ---------- Request Schemas ----------

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Unique username for the new account
          example: john
        password:
          type: string
          format: password
          description: Password (minimum length configurable, default 8 characters)
          minLength: 8
          example: securepass123
        email:
          type: string
          format: email
          description: Optional email address for verification and password reset
          example: john@example.com

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username
          example: john
        password:
          type: string
          format: password
          description: User password
          example: securepass123

    VerifyEmailRequest:
      type: object
      description: |
        Request body depends on the configured verification mode.
        In code mode, provide `code` and `email`. In token mode, provide `token`.
      properties:
        token:
          type: string
          description: Verification token (token mode only, format "userID:randomHex")
          example: "user-1:a1b2c3d4e5f6"
        code:
          type: string
          description: Verification code (code mode only, e.g. 6-digit number)
          example: "123456"
        email:
          type: string
          format: email
          description: User email address (code mode only, used to look up the user)
          example: john@example.com

    ForgotPasswordRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: Email address or username of the account
          example: john@example.com

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: Password reset token received via email
          example: "user-1:a1b2c3d4e5f6"
        password:
          type: string
          format: password
          description: New password (minimum length configurable, default 8 characters)
          minLength: 8
          example: newSecurePass456

    OAuthLinkRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Authorization code from the OAuth provider
          example: authorization-code-from-provider

    TwoFactorCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: TOTP code from authenticator app or a backup code
          example: "123456"

    TwoFactorVerifyRequest:
      type: object
      required: [token, code]
      properties:
        token:
          type: string
          description: Pending 2FA token received from the login endpoint
          example: pending-2fa-token
        code:
          type: string
          description: TOTP code from authenticator app, backup code, or email code
          example: "123456"

    TwoFactorSendEmailCodeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Pending 2FA token received from the login endpoint
          example: pending-2fa-token

    # ---------- Response Schemas ----------

    AuthResponse:
      type: object
      description: Successful authentication response with user info and access token
      required: [id, username, roles, accessToken]
      properties:
        id:
          type: string
          description: Unique user identifier
          example: user-1
        username:
          type: string
          description: Username
          example: john
        roles:
          type: array
          items:
            type: string
          description: List of user roles
          example: [user]
        accessToken:
          type: string
          description: JWT access token (short-lived, typically 5 minutes)
          example: eyJhbGciOiJIUzI1NiJ9...

    UserInfo:
      type: object
      description: User information (no access token)
      required: [id, username, roles]
      properties:
        id:
          type: string
          description: Unique user identifier
          example: user-1
        username:
          type: string
          description: Username
          example: john
        roles:
          type: array
          items:
            type: string
          description: List of user roles
          example: [user]

    TwoFactorPendingResponse:
      type: object
      description: Response when 2FA verification is required to complete login
      required: [twoFactorToken]
      properties:
        twoFactorToken:
          type: string
          description: Pending token to use with the 2FA verify endpoint
          example: pending-token-value

    TwoFactorSetupResponse:
      type: object
      description: 2FA setup data including TOTP secret, provisioning URL, and backup codes
      required: [secret, url, backupCodes]
      properties:
        secret:
          type: string
          description: TOTP secret key (base32-encoded)
          example: JBSWY3DPEHPK3PXP
        url:
          type: string
          format: uri
          description: OTP auth URL for QR code generation
          example: "otpauth://totp/MyApp:john?secret=JBSWY3DPEHPK3PXP&issuer=MyApp"
        backupCodes:
          type: array
          items:
            type: string
          description: One-time backup codes (store securely, each can be used once)
          example: ["12345678", "87654321", "11223344"]

    MessageResponse:
      type: object
      description: Generic success message
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable success message
          example: operation completed successfully

    ErrorResponse:
      type: object
      description: Error response with a human-readable message
      required: [message]
      properties:
        message:
          type: string
          description: Human-readable error description
          example: something went wrong

    HealthResponse:
      type: object
      description: Server health status
      required: [status, timestamp]
      properties:
        status:
          type: string
          description: Health status
          enum: [ok]
          example: ok
        timestamp:
          type: string
          format: date-time
          description: Current server time in RFC3339 format
          example: "2024-01-01T00:00:00Z"
